<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lychee Media</title>
    <meta name="description" content="Lychee Media" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <!-- Section 1: Hero — lychee on right -->
      <section class="section" id="s1"></section>

      <!-- Section 2: Craft — lychee drifts to centre, tips forward -->
      <section class="section" id="s2"></section>

      <!-- Section 3: lychee swings left, spins fast -->
      <section class="section" id="s3"></section>

      <!-- Section 4: lychee breaks open -->
      <section class="section" id="s4"></section>
    </main>

    <div id="label">Lychee Media © 2026</div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="main.js"></script>
  </body>
</html>
